spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: ms-auth-login
              uri: lb://ms-auth
              predicates:
                - Path=/api/auth/**
            - id: ms-auth-roles
              uri: lb://ms-auth
              predicates:
                - Path=/api/roles/**
            - id: ms-auth-users
              uri: lb://ms-auth
              predicates:
                - Path=/api/users/**
            - id: ms-configuracion-categories
              uri: lb://ms-configuracion
              predicates:
                - Path=/api/categories/**
            - id: ms-configuracion-taxes
              uri: lb://ms-configuracion
              predicates:
                - Path=/api/taxes/**
            - id: ms-producto
              uri: lb://ms-producto
              predicates:
                - Path=/api/productos/**
            - id: ms-cliente
              uri: lb://ms-cliente
              predicates:
                - Path=/api/customers/**
            - id: ms-inventario
              uri: lb://ms-inventario
              predicates:
                - Path=/api/inventario/**
            - id: ms-ventas
              uri: lb://ms-ventas
              predicates:
                - Path=/api/sales/**
            - id: ms-proveedores
              uri: lb://ms-proveedores
              predicates:
                - Path=/api/suppliers/**
                - Path=/api/purchase-orders/**
            - id: ms-pagos
              uri: lb://ms-pagos
              predicates:
                - Path=/api/payments/**
            - id: ms-informes
              uri: lb://ms-informes
              predicates:
                - Path=/api/reports/**
            - id: ms-notificaciones
              uri: lb://ms-notificaciones
              predicates:
                - Path=/api/notificaciones/**
server:
  port: ${PORT:8080}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
