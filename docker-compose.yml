      - mysql-configuracion
      - ms-eureka
    networks:
      - backend-network

  ms-producto:
    build: ./ms-producto
    container_name: ms-producto
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql-producto
      DB_PORT: 3306
      DB_NAME: db_producto
      DB_USER: appuser
      DB_PASSWORD: 1234
      JWT_SECRET: clave_super_secreta_12345678901234562026
      EUREKA_URL: http://ms-eureka:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-eureka:8761/eureka/
      CONFIGURATION_SERVICE_URL: http://ms-configuracion:8090
    depends_on:
      - mysql-producto
      - ms-eureka
      - ms-configuracion
    networks:
      - backend-network

  ms-cliente:
    build: ./ms-cliente
    container_name: ms-cliente
    restart: unless-stopped
    ports:
