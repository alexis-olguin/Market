      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_ventas
      MYSQL_USER: appuser
      MYSQL_PASSWORD: 1234
    ports:
      - "3312:3306"
    volumes:
      - mysql_ventas_data:/var/lib/mysql
    networks:
      - backend-network

  mysql-proveedores:
    image: mysql:8
    container_name: mysql-proveedores
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_proveedores
      MYSQL_USER: appuser
      MYSQL_PASSWORD: 1234
    ports:
      - "3313:3306"
    volumes:
      - mysql_proveedores_data:/var/lib/mysql
    networks:
      - backend-network

  mysql-pagos:
    image: mysql:8
    container_name: mysql-pagos
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_pagos
      MYSQL_USER: appuser
      MYSQL_PASSWORD: 1234
    ports:
      - "3314:3306"
    volumes:
      - mysql_pagos_data:/var/lib/mysql
    networks:
      - backend-network

  mysql-informes:
    image: mysql:8
    container_name: mysql-informes
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_informes
      MYSQL_USER: appuser
