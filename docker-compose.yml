      EUREKA_URL: http://ms-eureka:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-eureka:8761/eureka/
      MS_PRODUCTOS_URL: http://ms-producto:8081/api/productos
      MS_NOTIFICACIONES_URL: http://ms-notificaciones:8089/api/notificaciones
    depends_on:
      - mysql-inventario
      - ms-eureka
    networks:
