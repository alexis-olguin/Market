    container_name: mysql-notificaciones
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_notificaciones
      MYSQL_USER: appuser
      MYSQL_PASSWORD: 1234
    ports:
      - "3316:3306"
    volumes:
      - mysql_notificaciones_data:/var/lib/mysql
    networks:
      - backend-network

  ms-eureka:
    build: ./ms-eureka
    container_name: ms-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - backend-network

  ms-gateway:
    build: ./ms-gateway
    container_name: ms-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://ms-eureka:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-eureka:8761/eureka/
    depends_on:
      - ms-eureka
    networks:
      - backend-network

  ms-auth:
    build: ./ms-auth
    container_name: ms-auth
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      DB_HOST: mysql-auth
      DB_PORT: 3306
      DB_NAME: db_auth
      DB_USER: appuser
      DB_PASSWORD: 1234
      JWT_SECRET: clave_super_secreta_12345678901234562026
      EUREKA_URL: http://ms-eureka:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-eureka:8761/eureka/
    depends_on:
      - mysql-auth
      - ms-eureka
    networks:
      - backend-network

  ms-configuracion:
    build: ./ms-configuración
    container_name: ms-configuracion
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      DB_HOST: mysql-configuracion
      DB_PORT: 3306
      DB_NAME: db_configuracion
      DB_USER: appuser
      DB_PASSWORD: 1234
      JWT_SECRET: clave_super_secreta_12345678901234562026
      EUREKA_URL: http://ms-eureka:8761/eureka/
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://ms-eureka:8761/eureka/
