spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: ms-auth
          uri: lb://ms-auth
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/roles/**
        - id: ms-inventario
          uri: lb://ms-inventario
          predicates:
            - Path=/api/inventory/**
        - id: ms-proveedores
          uri: lb://ms-proveedores
          predicates:
            - Path=/api/suppliers/**,/api/purchase-orders/**
        - id: ms-notificaciones
          uri: lb://ms-notificaciones
          predicates:
            - Path=/api/notificaciones/**

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
